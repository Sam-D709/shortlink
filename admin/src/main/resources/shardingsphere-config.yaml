# 数据源集合
dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://127.0.0.1:3306/shortlink?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: MySQL

rules:
  - !SHARDING
    tables:
      user:
        actualDataNodes: ds_0.user_${1..16}
        tableStrategy:
          standard:
            shardingColumn: username
            shardingAlgorithmName: user_table_inline

      linkgroup:
        actualDataNodes: ds_0.linkgroup_${1..16}
        tableStrategy:
          standard:
            shardingColumn: username
            shardingAlgorithmName: linkgroup_table_inline

    shardingAlgorithms:
      user_table_inline:
        type: INLINE
        props:
          algorithm-expression: user_${(Math.abs(username.hashCode()) % 16) + 1}
      linkgroup_table_inline:
        type: INLINE
        props:
          algorithm-expression: linkgroup_${(Math.abs(username.hashCode()) % 16) + 1}

  - !ENCRYPT
    tables:
      t_user:
        columns:
          phone:
            cipher:
              name: phone
              encryptorName: common_encryptor
          email:
            cipher:
              name: email
              encryptorName: common_encryptor
    encryptors:
      common_encryptor:
        # 加密算法类型
        type: AES
        props:
          # AES 加密密钥
          aes-key-value: d6oadClrrb9A3GWo
          digest-algorithm-name: MD5
# 展现逻辑 SQL & 真实 SQL
props:
  sql-show: true